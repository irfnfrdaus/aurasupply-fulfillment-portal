name: AuraSupply CI/CD Quality Gate Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  automated-qa-testing:
    name: 🧪 Automated Quality Gate & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: 📦 Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: 🚀 Run SDET API Integration Test Suite
        run: |
          cd server
          npm test

      - name: 📦 Install Client Dependencies & Verify Frontend Build
        run: |
          cd client
          npm ci
          npm run build

  docker-container-validation:
    name: 🐳 Docker Container Build & Compose Validation
    runs-on: ubuntu-latest
    needs: automated-qa-testing

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Server Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          tags: aurasupply-server:latest

      - name: 🏗️ Build Client Nginx Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: false
          tags: aurasupply-client:latest

      - name: 🩺 Validate Docker Compose Architecture
        run: docker compose config

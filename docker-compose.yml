version: '3.8'

services:
  aurasupply-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: aurasupply-server
    ports:
      - "5050:5050"
    environment:
      - PORT=5050
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5050/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  aurasupply-client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: aurasupply-client
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      aurasupply-server:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: aurasupply-network
